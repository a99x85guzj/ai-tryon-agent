services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tryon
      POSTGRES_USER: tryon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tryon -d tryon"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      CHECKPOINT_BACKEND: postgres
      DATABASE_URL: postgresql://tryon:${POSTGRES_PASSWORD:-change-me}@postgres:5432/tryon
      TRYON_OUTPUT_DIR: /app/data/tryon_output
      API_AUTH_ENABLED: ${API_AUTH_ENABLED:-false}
      API_KEY: ${API_KEY:-}
      APP_MOCK_MODE: ${APP_MOCK_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - ./data:/app/data
      - rembg_models:/models/rembg
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_KEY: ${API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  postgres_data:
  rembg_models:
